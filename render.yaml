services:
  - type: web
    name: velocore-api
    env: go
    rootDir: backend
    buildCommand: go build -o main .
    startCommand: ./main
    envVars:
      - key: PORT
        value: 8080

  - type: web
    name: velocore-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
